<div class="auth-page auth-page--centered">
  <div class="auth-page__panel">
    <div class="auth-page__card">
      <div class="auth-page__brand">
        <h1 class="auth-page__title">{{ 'login.title' | t }}</h1>
        <p class="auth-page__sub">{{ 'login.subtitle' | t }}</p>
      </div>

      <form class="auth-page__form" [formGroup]="form" (ngSubmit)="submit()">
        <p class="auth-page__error" *ngIf="error" role="alert">{{ error }}</p>

        <label class="auth-page__field">
          <span class="auth-page__label">{{ 'login.email' | t }}</span>
          <input type="email" formControlName="email" autocomplete="username" />
        </label>

        <label class="auth-page__field">
          <span class="auth-page__label">{{ 'login.password' | t }}</span>
          <div class="password-field">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
            />
            <button
              class="password-toggle"
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              {{ showPassword ? ('login.hidePassword' | t) : ('login.showPassword' | t) }}
            </button>
          </div>
        </label>

        <button class="auth-page__submit" type="submit" [disabled]="busy">
          {{ busy ? ('login.loading' | t) : ('login.submit' | t) }}
        </button>
      </form>

      <div class="auth-page__links">
        <a routerLink="/home" class="auth-page__link">{{ 'landing.footer.home' | t }}</a>
        <a routerLink="/register" class="auth-page__link">{{ 'login.createAccount' | t }}</a>
        <button type="button" class="auth-page__lang" (click)="toggleLang()">{{ 'login.lang' | t }}</button>
      </div>
    </div>
  </div>
</div>
