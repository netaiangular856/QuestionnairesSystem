<div class="page-workspace recommendations-page action-plans-page apl-create-page">
  <div class="rec-page">
    <section class="rec-hero" aria-labelledby="apl-create-title">
      <div class="rec-hero__left">
        <div class="rec-hero__icon" aria-hidden="true"><i class="pi pi-plus-circle"></i></div>
        <div class="rec-hero__body">
          <p class="rec-hero__kicker">{{ 'q.plans.heroKicker' | t }}</p>
          <h1 id="apl-create-title" class="rec-hero__title">{{ 'q.plans.createTitle' | t }}</h1>
          <p class="rec-hero__lead">{{ 'q.plans.createSubtitle' | t }}</p>
        </div>
      </div>
      <div class="rec-hero__cta">
        <a routerLink="/action-plans" class="btn-ghost rec-hero__add rec-hero__add--compact">
          <i class="pi pi-list" aria-hidden="true"></i>
          {{ 'nav.actionPlans' | t }}
        </a>
      </div>
    </section>

  @if (lookupsBusy()) {
    <div class="card rec-panel rec-panel--muted">
      <div class="rec-loading">
        <span class="rec-loading__dot" aria-hidden="true"></span>
        {{ 'common.loading' | t }}
      </div>
    </div>
  } @else {
    <div class="card stack-form apl-create__card">
      <div class="stack-form__grid">
        <label class="stack-form__field">
          <span>{{ 'q.plans.titleAr' | t }}</span>
          <input type="text" [(ngModel)]="titleAr" name="titleAr" maxlength="500" autocomplete="off" />
        </label>
        <label class="stack-form__field">
          <span>{{ 'q.plans.titleEn' | t }}</span>
          <input type="text" [(ngModel)]="titleEn" name="titleEn" maxlength="500" autocomplete="off" />
        </label>
      </div>
      <label class="stack-form__field">
        <span>{{ 'q.plans.descAr' | t }}</span>
        <textarea [(ngModel)]="descriptionAr" name="descriptionAr" rows="2" maxlength="4000"></textarea>
      </label>
      <label class="stack-form__field">
        <span>{{ 'q.plans.descEn' | t }}</span>
        <textarea [(ngModel)]="descriptionEn" name="descriptionEn" rows="2" maxlength="4000"></textarea>
      </label>
      <div class="stack-form__grid">
        <label class="stack-form__field">
          <span>{{ 'q.plans.survey' | t }}</span>
          <select [(ngModel)]="surveyId" name="surveyId">
            <option [ngValue]="null">{{ 'q.plans.surveyNone' | t }}</option>
            @for (s of surveys(); track s.id) {
              <option [ngValue]="s.id">{{ surveyLabel(s) }}</option>
            }
          </select>
        </label>
        <label class="stack-form__field">
          <span>{{ 'q.plans.owner' | t }}</span>
          <select [(ngModel)]="ownerUserId" name="ownerUserId">
            <option [ngValue]="null">{{ 'q.plans.surveyNone' | t }}</option>
            @for (u of users(); track u.id) {
              <option [ngValue]="u.id">{{ userLabel(u) }}</option>
            }
          </select>
        </label>
      </div>
      <div class="stack-form__grid">
        <label class="stack-form__field">
          <span>{{ 'q.plans.start' | t }}</span>
          <div class="apl-create__date">
            <input
              #startDateIn
              type="date"
              class="apl-create__date-input"
              [(ngModel)]="startDate"
              name="startDate"
            />
            <button
              type="button"
              class="apl-create__date-btn"
              (click)="openDatePicker(startDateIn)"
              [attr.aria-label]="'q.plans.pickStartDate' | t"
            >
              <i class="pi pi-calendar" aria-hidden="true"></i>
            </button>
          </div>
        </label>
        <label class="stack-form__field">
          <span>{{ 'q.plans.end' | t }}</span>
          <div class="apl-create__date">
            <input
              #endDateIn
              type="date"
              class="apl-create__date-input"
              [(ngModel)]="endDate"
              name="endDate"
            />
            <button
              type="button"
              class="apl-create__date-btn"
              (click)="openDatePicker(endDateIn)"
              [attr.aria-label]="'q.plans.pickEndDate' | t"
            >
              <i class="pi pi-calendar" aria-hidden="true"></i>
            </button>
          </div>
        </label>
      </div>
      <div class="stack-form__actions apl-create__actions">
        <button type="button" class="btn-primary apl-create__submit" (click)="submit()" [disabled]="submitBusy()">
          @if (submitBusy()) {
            {{ 'common.loading' | t }}
          } @else {
            {{ 'q.plans.save' | t }}
          }
        </button>
      </div>
    </div>
  }
  </div>
</div>
