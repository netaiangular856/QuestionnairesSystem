<div class="page-workspace change-password-page">
  @if (session(); as s) {
    <div class="auth-page auth-page--split auth-page--embedded">
      <div class="auth-page__shell">
        <div class="auth-page__form-col">
          <div class="auth-page__card">
            <a routerLink="/profile" class="auth-page__back">{{ 'changePassword.backToProfile' | t }}</a>

            <div class="auth-page__brand">
              <img class="auth-page__logo" src="assets/brand/logo.png" alt="" />
              <p class="auth-page__product">{{ 'app.title' | t }}</p>
              <h1 class="auth-page__title">{{ 'changePassword.title' | t }}</h1>
              <p class="auth-page__sub">{{ 'changePassword.subtitle' | t }}</p>
            </div>

            <p class="change-password-page__hint">
              {{ 'changePassword.signedInAs' | t }} <strong>{{ s.email || s.userName || '—' }}</strong>
            </p>

            <form [formGroup]="pwdForm" (ngSubmit)="submitPassword()" class="auth-page__form change-password-page__form">
              <label class="auth-page__field">
                <span class="auth-page__label">{{ 'profile.currentPassword' | t }}</span>
                <input type="password" formControlName="currentPassword" autocomplete="current-password" />
              </label>
              <label class="auth-page__field">
                <span class="auth-page__label">{{ 'profile.newPassword' | t }}</span>
                <input type="password" formControlName="newPassword" autocomplete="new-password" />
              </label>
              <button type="submit" class="auth-page__submit change-password-page__submit" [disabled]="busy()">
                {{ 'profile.savePassword' | t }}
              </button>
            </form>

            <footer class="auth-page__footer auth-page__footer--solo">
              <button type="button" class="auth-page__footer-lang" (click)="toggleLang()">{{ 'login.lang' | t }}</button>
            </footer>
          </div>
        </div>

        <aside class="auth-page__visual" aria-hidden="true">
          <div class="auth-page__visual-inner">
            <img src="assets/brand/ChangePassword.png" alt="" width="640" height="640" />
          </div>
        </aside>
      </div>
    </div>
  }
</div>
