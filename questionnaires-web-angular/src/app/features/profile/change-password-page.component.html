<div class="page-workspace change-password-page">
  @if (session(); as s) {
    <div class="change-password-page__center">
      <section class="card change-password-page__card">
        <a routerLink="/profile" class="change-password-page__back">{{ 'changePassword.backToProfile' | t }}</a>

        <h1 class="change-password-page__title">{{ 'changePassword.title' | t }}</h1>
        <p class="change-password-page__sub">{{ 'changePassword.subtitle' | t }}</p>
        <p class="change-password-page__hint">
          {{ 'changePassword.signedInAs' | t }} <strong>{{ s.email || s.userName || '—' }}</strong>
        </p>

        <form [formGroup]="pwdForm" (ngSubmit)="submitPassword()" class="stack-form change-password-page__form">
          <label>
            <span>{{ 'profile.currentPassword' | t }}</span>
            <input type="password" formControlName="currentPassword" autocomplete="current-password" />
          </label>
          <label>
            <span>{{ 'profile.newPassword' | t }}</span>
            <input type="password" formControlName="newPassword" autocomplete="new-password" />
          </label>
          <button type="submit" class="btn-primary change-password-page__submit" [disabled]="busy()">
            {{ 'profile.savePassword' | t }}
          </button>
        </form>
      </section>
    </div>
  }
</div>
